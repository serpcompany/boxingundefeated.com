name: D1 import

# Imports a pinned boxer data artifact into the staging or production D1, by hand (#63). The
# artifact is the pipeline's boxers.json, pinned in R2 at boxers/<version>.json, where the version
# is its SHA-256 (scripts/d1/artifact.ts). How to pin one and run this: docs/agents/d1.md.
#
# - preflight (.github/scripts/verify-d1-import.sh): the inputs, the branch, no deploy of that
#   environment running or pending in ci.yml, and for production the staging receipt. Its summary
#   shows the version and how many boxers the run may prune.
# - staging: dispatch from staging. It fetches the version from boxingundefeated-com-data-staging,
#   checks its SHA-256, then runs db:import, db:parity and db:check-deployable on the staging D1.
#   Once all three pass, it records the receipt passed-d1-import-staging-<version> (90 days).
# - production: dispatch from main, with a version staging imported. The preflight refuses a
#   version without that receipt, then the job waits for the owner's approval of the `production`
#   environment. It fetches the version from boxingundefeated-com-data-production, or, when that
#   bucket lacks it, copies it there from the staging bucket (never an overwrite), since
#   production buckets change only through CI. Then it runs the same three commands with
#   --confirm-production, which records that approval.
#
# Boxer photos (#64): before the import, both jobs copy the photos the environment's D1 doesn't
# record yet from boxrec.com into its photo bucket, boxingundefeated-com-photos-<environment>, and
# record them in D1 (scripts/d1/copy-photos.ts): politely, for at most 35 minutes, resumably; a
# run with nothing new copies nothing. The import's finish then moves the page cache to a new
# generation, so pages render with the new photos. The counts go into the job summary. The
# production bucket, like production D1, changes only here, after the owner's approval.
#
# Both refuse a D1 that lacks one of this commit's migrations: run it after the deploy of this
# commit has migrated that environment. Both refuse while a ci.yml deploy of the environment runs
# or is pending, in the preflight and again right before the import; the other way round,
# ci.yml's deploy jobs refuse to migrate while an unfinished run of this workflow names their
# environment, or none, in its run-name (#104). Both also refuse unless the branch is still at the
# commit the run checked out, before their first Cloudflare step and again before their first D1
# step, since a queue or the production approval can outlast a merge: re-dispatch from the new
# tip. Imports keep the prune cap (scripts/d1/import-boxers.ts); allow_prune, at most 250, raises
# it for one run and shows in the run's name. A re-import keeps the last version's pages up while
# it runs; a deploy of the same environment that starts meanwhile refuses before it migrates, so
# the owner re-runs that deploy after the import. Keep the run-name's "D1 import, <environment>,"
# prefix: that guard reads it.
#
# Never on push or pull request. Only the wrangler steps receive the Cloudflare secrets. Agents
# never dispatch or re-run this workflow, or approve the `production` environment (AGENTS.md).

# Names each run by its target, version and any allow_prune, so `gh run list --workflow
# d1-import.yml` lists them and the production approver sees them.
run-name: >-
  D1 import, ${{ inputs.environment }}, ${{ inputs.version }}${{ inputs.allow_prune != ''
  && format(', allow_prune {0}', inputs.allow_prune) || '' }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: The D1 to import into. Dispatch staging from staging, production from main.
        type: choice
        options: [staging, production]
        required: true
      version:
        description: The artifact version, its SHA-256 (pnpm db:upload-artifact prints it)
        type: string
        required: true
      allow_prune:
        description: Optional. Let this import prune up to this many boxers (at most 250) the artifact no longer has
        type: string
        required: false
        default: ''

permissions:
  contents: read

# One import per environment at a time. A dispatch that joins the group cancels one waiting there,
# never a running one.
concurrency:
  group: d1-import-${{ inputs.environment }}
  cancel-in-progress: false

env:
  WRANGLER_SEND_METRICS: false
  VERSION: ${{ inputs.version }}
  ALLOW_PRUNE: ${{ inputs.allow_prune }}
  # Under the gitignored from-pipeline/, so the parity report names it like a local source.
  SOURCE: from-pipeline/boxers-${{ inputs.version }}.json

jobs:
  preflight:
    name: Check the inputs, the branch, the deploys and, for production, the staging import
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout the import scripts
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      # Fails closed; the script lists its checks.
      - name: Verify this import
        env:
          GH_TOKEN: ${{ github.token }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: .github/scripts/verify-d1-import.sh

  staging:
    name: Import into staging
    needs: preflight
    if: inputs.environment == 'staging'
    runs-on: ubuntu-latest
    # The photo copy may take 35 minutes; the import, parity and checks take a few more.
    timeout-minutes: 75
    # actions: read for the deploy check.
    permissions:
      actions: read
      contents: read
    environment:
      name: staging
      url: https://staging.boxingundefeated.com
    steps:
      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::The staging environment needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install
        uses: ./.github/actions/install

      # The checkout is this run's commit; refuse before any Cloudflare step if staging has moved
      # on since (a queue can outlast a merge).
      - name: Require staging to be at this run's commit
        env:
          GH_TOKEN: ${{ github.token }}
          ENVIRONMENT: staging
        run: .github/scripts/verify-d1-import.sh --tip-only

      - name: Fetch the artifact from the staging bucket and check its SHA-256
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm db:fetch-artifact -- --target staging --version "$VERSION" --out "$SOURCE"

      # Again, right before the first D1 step.
      - name: Require no deploy of staging running or pending
        env:
          GH_TOKEN: ${{ github.token }}
          ENVIRONMENT: staging
        run: .github/scripts/verify-d1-import.sh --deploys-only

      # And the tip again, after the fetch.
      - name: Require staging to still be at this run's commit
        env:
          GH_TOKEN: ${{ github.token }}
          ENVIRONMENT: staging
        run: .github/scripts/verify-d1-import.sh --tip-only

      - name: Require every migration of this commit in the staging D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm db:check-deployable -- --target staging --migrations-only

      # Needs the photos table (migration 0003), so after the check above. Writes the staging
      # photo bucket and D1; stops cleanly at the budget, leaving the rest to the next run.
      - name: Copy new boxer photos into the staging photo bucket
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm db:copy-photos -- --target staging --source "$SOURCE" --max-minutes 35 --summary "$GITHUB_STEP_SUMMARY"

      # The copy can take a while: the tip once more, right before the import.
      - name: Require staging to still be at this run's commit after the photo copy
        env:
          GH_TOKEN: ${{ github.token }}
          ENVIRONMENT: staging
        run: .github/scripts/verify-d1-import.sh --tip-only

      - name: Import into the staging D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm db:import -- --target staging --source "$SOURCE" ${ALLOW_PRUNE:+--allow-prune "$ALLOW_PRUNE"}

      - name: Prove the import with parity
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm db:parity -- --target staging --source "$SOURCE" --out "$RUNNER_TEMP/parity-staging.md"

      - name: Require the staging D1 to be deployable
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm db:check-deployable -- --target staging

      # Reached only when every step above passed. The production preflight reads it.
      - name: Record the staging receipt for this version
        run: echo "$VERSION $GITHUB_SHA" > "$RUNNER_TEMP/imported.txt"

      - name: Upload the staging receipt
        uses: actions/upload-artifact@v7
        with:
          name: passed-d1-import-staging-${{ inputs.version }}
          path: ${{ runner.temp }}/imported.txt
          retention-days: 90
          overwrite: true

      - name: Parity report in the job summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/parity-staging.md" ]; then
            cat "$RUNNER_TEMP/parity-staging.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the parity report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: d1-import-staging-parity-${{ github.run_attempt }}
          path: ${{ runner.temp }}/parity-staging.md
          if-no-files-found: ignore
          retention-days: 90

  production:
    name: Import into production
    needs: preflight
    if: inputs.environment == 'production'
    runs-on: ubuntu-latest
    # The photo copy may take 35 minutes; the import, parity and checks take a few more.
    timeout-minutes: 75
    # actions: read for the deploy check.
    permissions:
      actions: read
      contents: read
    # Asks for the owner's approval, and admits only main.
    environment:
      name: production
      url: https://boxingundefeated.com
    steps:
      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::The production environment needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install
        uses: ./.github/actions/install

      # The checkout is this run's commit, and main may have moved on during the approval wait:
      # refuse before any Cloudflare step, so a stale run neither reads nor writes a bucket.
      - name: Require main to be at this run's commit
        env:
          GH_TOKEN: ${{ github.token }}
          ENVIRONMENT: production
        run: .github/scripts/verify-d1-import.sh --tip-only

      # A re-import reads the version production already pins. A key holding other content fails
      # the step; nothing is ever overwritten.
      - name: Fetch the artifact from the production bucket, if it is pinned there
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm db:fetch-artifact -- --target production --version "$VERSION" --out "$SOURCE" --if-exists

      # Otherwise from the staging bucket. The upload reads the production object back and checks
      # its SHA-256, so what production pins is exactly what this job imports.
      - name: Otherwise copy it from the staging bucket into the production bucket
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -f "$SOURCE" ]; then
            echo "The production bucket already pins $VERSION: nothing to copy."
            exit 0
          fi
          pnpm db:fetch-artifact -- --target staging --version "$VERSION" --out "$SOURCE"
          pnpm db:upload-artifact -- --target production --confirm-production --source "$SOURCE"

      # Again, right before the first D1 step, since the approval can come long after the
      # preflight.
      - name: Require no deploy of production running or pending
        env:
          GH_TOKEN: ${{ github.token }}
          ENVIRONMENT: production
        run: .github/scripts/verify-d1-import.sh --deploys-only

      # And the tip again, after the fetch or the copy.
      - name: Require main to still be at this run's commit
        env:
          GH_TOKEN: ${{ github.token }}
          ENVIRONMENT: production
        run: .github/scripts/verify-d1-import.sh --tip-only

      # --confirm-production from here on records the owner's approval of this run's
      # `production` environment (docs/agents/d1.md).
      - name: Require every migration of this commit in the production D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm db:check-deployable -- --target production --confirm-production --migrations-only

      # As on staging, into the production photo bucket and D1.
      - name: Copy new boxer photos into the production photo bucket
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm db:copy-photos -- --target production --confirm-production --source "$SOURCE" --max-minutes 35 --summary "$GITHUB_STEP_SUMMARY"

      - name: Require main to still be at this run's commit after the photo copy
        env:
          GH_TOKEN: ${{ github.token }}
          ENVIRONMENT: production
        run: .github/scripts/verify-d1-import.sh --tip-only

      - name: Import into the production D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm db:import -- --target production --confirm-production --source "$SOURCE" ${ALLOW_PRUNE:+--allow-prune "$ALLOW_PRUNE"}

      - name: Prove the import with parity
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm db:parity -- --target production --confirm-production --source "$SOURCE" --out "$RUNNER_TEMP/parity-production.md"

      - name: Require the production D1 to be deployable
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm db:check-deployable -- --target production --confirm-production

      - name: Parity report in the job summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/parity-production.md" ]; then
            cat "$RUNNER_TEMP/parity-production.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the parity report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: d1-import-production-parity-${{ github.run_attempt }}
          path: ${{ runner.temp }}/parity-production.md
          if-no-files-found: ignore
          retention-days: 90
