name: Deploy Production

# main is production. Every push to main (a promotion from staging, or a hotfix) builds the
# production Worker, migrates the production D1, deploys, and smoke-tests it. The `production`
# environment admits only main, holds CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, and requires
# the owner's approval before the job starts; only the wrangler steps receive the secrets.
#
# Until the cutover (#19) the production Worker is on workers.dev only, and the smoke test runs
# there with the smoke-test header. At the cutover, point SMOKE_ORIGIN and the environment URL at
# https://boxingundefeated.com.
#
# Agents never dispatch this workflow or approve its job. The owner dispatches it from main to
# redeploy, or with `hotfix` for a hotfix that staging never deployed.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      hotfix:
        description: Deploy main although no staging deploy verified this tree (an owner-approved hotfix)
        type: boolean
        default: false

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1
  WRANGLER_SEND_METRICS: false

jobs:
  staging-verified:
    name: Require a verified staging deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      # A promotion fast-forwards main to a staging commit, or merges staging into main with the
      # same tree. Either way a successful Deploy Staging run deployed and smoke-tested that tree.
      - name: Require a successful staging deploy of this tree
        env:
          GH_TOKEN: ${{ github.token }}
          HOTFIX: ${{ github.event_name == 'workflow_dispatch' && inputs.hotfix }}
        run: |
          if [ "$HOTFIX" = "true" ]; then
            echo "::warning title=Hotfix::Deploying $GITHUB_SHA without a staging deploy of its tree. Merge main into staging next."
            exit 0
          fi
          staging="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/staging" --jq '[.[] | select(.ref == "refs/heads/staging")] | length')"
          if [ "$staging" = "0" ]; then
            echo "::notice::There is no staging branch yet, so there is no staging deploy to require."
            exit 0
          fi
          tree="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq .commit.tree.sha)"
          verified="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-staging.yml/runs?branch=staging&status=success&per_page=100" --jq '.workflow_runs[].head_commit.tree_id')"
          if grep -qx "$tree" <<<"$verified"; then
            echo "A successful Deploy Staging run deployed tree $tree."
            exit 0
          fi
          echo "::error::No successful Deploy Staging run deployed tree $tree. Promote from staging (git push origin origin/staging:main) after its deploy passes; for a hotfix, the owner dispatches this workflow with hotfix."
          exit 1

  deploy:
    name: Migrate, deploy and smoke-test production
    needs: staging-verified
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Migrate, deploy and smoke test stay in this one job. Deploys never overlap; a newer push
    # replaces a queued one, never a running one.
    concurrency:
      group: deploy-web-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://boxingundefeated-com-production.serpcompany.workers.dev
    env:
      SMOKE_ORIGIN: https://boxingundefeated-com-production.serpcompany.workers.dev
    steps:
      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::The production environment needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install
        uses: ./.github/actions/install

      # Built before anything touches Cloudflare, so a failed build never leaves a migrated D1
      # behind the old Worker.
      - name: Build the production Worker
        run: pnpm --filter web build:worker:production

      - name: Require the build to match env.production
        run: pnpm --filter web check:build-environment production

      - name: Migrate the production D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm db:migrate:production

      - name: Require the production D1 to be deployable
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm db:check-deployable -- --target production --confirm-production

      - name: Deploy the production Worker
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec opennextjs-cloudflare deploy --env production

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      # Asserts production is indexable (no noindex, robots allows crawling and lists the sitemap,
      # GTM present) among the rest (#16's suite). It sends the smoke-test header to workers.dev.
      - name: Smoke-test production
        env:
          BASE_URL: ${{ env.SMOKE_ORIGIN }}
          EXPECT_ENV: production
        run: pnpm test:e2e

      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-production-${{ github.run_attempt }}
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14
